<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>دفتر الإيجارات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f6f5;
  --surface:#ffffff;
  --surface-2:#eceef0;
  --ink:#15201e;
  --ink-2:#4a5a57;
  --ink-3:#7c8c89;
  --line:#dde2e1;
  --accent:#0f6b5c;
  --accent-soft:#e2efec;
  --accent-ink:#0b5148;
  --on-accent:#ffffff;
  --warn:#a8701a;
  --warn-soft:#f8eedd;
  --danger:#a53a2f;
  --danger-soft:#f9e6e3;
  --ok:#2e6b46;
  --ok-soft:#e3efe8;
  --shadow:0 1px 2px rgba(21,32,30,.06),0 8px 24px rgba(21,32,30,.06);
  --r:12px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101816;
    --surface:#17211f;
    --surface-2:#1f2b28;
    --ink:#e8efec;
    --ink-2:#a8bab5;
    --ink-3:#7b8d89;
    --line:#27332f;
    --accent:#4fc0a8;
    --accent-soft:#16302b;
    --accent-ink:#7fd6c2;
    --on-accent:#08201c;
    --warn:#d9a45c;
    --warn-soft:#2e2418;
    --danger:#e08376;
    --danger-soft:#331e1b;
    --ok:#6fbd8e;
    --ok-soft:#182a20;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#101816; --surface:#17211f; --surface-2:#1f2b28;
  --ink:#e8efec; --ink-2:#a8bab5; --ink-3:#7b8d89; --line:#27332f;
  --accent:#4fc0a8; --accent-soft:#16302b; --accent-ink:#7fd6c2; --on-accent:#08201c;
  --warn:#d9a45c; --warn-soft:#2e2418;
  --danger:#e08376; --danger-soft:#331e1b;
  --ok:#6fbd8e; --ok-soft:#182a20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.6;direction:rtl;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;font-weight:500;margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-start:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:6px 10px 18px;display:flex;align-items:baseline;gap:8px}
.brand b{font-family:"Readex Pro",sans-serif;font-weight:600;font-size:19px;letter-spacing:-.2px}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--ink-2);text-align:right;width:100%;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .ic{width:18px;text-align:center;opacity:.9}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:10px;display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok)}
main{padding:26px 30px 90px;max-width:1180px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:25px}
.head p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px}

/* buttons */
.btn{background:var(--accent);color:var(--on-accent);border:0;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:500;border-radius:7px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.tile .lbl{font-size:11.5px;letter-spacing:.07em;color:var(--ink-3);text-transform:none}
.tile .val{font-family:"Readex Pro",sans-serif;font-size:26px;font-weight:500;margin-top:5px;letter-spacing:-.5px}
.tile .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.tile.alert{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.tile.alert .val{color:var(--danger)}

/* panels & tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel>header h2{font-size:15.5px;font-weight:600;font-family:"IBM Plex Sans Arabic",sans-serif}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-weight:600;font-size:11.5px;letter-spacing:.05em;color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.wide{white-space:normal;min-width:160px}
.empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.mute{background:var(--surface-2);color:var(--ink-3)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* occupancy bar */
.occ{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.occ i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

/* form */
.modal{position:fixed;inset:0;background:rgba(10,18,16,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:88vh;overflow:auto}
.modal header{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{font-size:16px}
.modal .body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.modal footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-start}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.f textarea{min-height:62px;resize:vertical}
.x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-3);padding:2px 6px}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar select,.bar input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.note{font-size:12.5px;color:var(--ink-3);padding:0 16px 14px}
.rowact{display:flex;gap:6px}
.linkbtn{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px}
.linkbtn:hover{color:var(--danger)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:18px}

/* mobile */
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 14px 84px}
  .head h1{font-size:21px}
  .modal .body{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40}
  .tabbar button{background:none;border:0;padding:9px 2px 11px;font-size:10.5px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .tabbar .ic{font-size:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b>دفتر الإيجارات</b><span>إدارة الغرف والمحلات</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="whoTxt" style="font-weight:600;color:var(--ink-2)"></div>
      <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">جارٍ الاتصال…</span></div>
      <button class="btn ghost sm" id="themeBtn">تبديل الوضع الليلي</button>
      <button class="btn ghost sm" data-act="switch">خروج / تغيير الدور</button>
    </div>
  </aside>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modalHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";

/* ---------- الحالة والتخزين ---------- */
var COLS = ["units","tenants","contracts","payments","expenses","tickets","settings","log"];
var S = {units:[],tenants:[],contracts:[],payments:[],expenses:[],tickets:[],settings:[],log:[]};
var DB = null, tab = "dash", seeded = false;
var ROLE = null;   // "manager" = المالك/المدير ، "viewer" = المستخدم المتابع
try{ ROLE = localStorage.getItem("ijar-role") || null; }catch(e){}
function isOwner(){ return ROLE === "manager"; }   // المالك: كل شيء + الحذف والإعدادات
function RO(){ return false; }                     // المتابع يدخل ويعدّل — القيود على الحذف فقط
var ROLE_AR = {manager:"المالك", viewer:"المتابع"};
var COL_AR = {units:"وحدة", tenants:"مستأجر", contracts:"عقد", payments:"دفعة", expenses:"مصروف", tickets:"بلاغ"};
function logAct(txt){
  if(!txt) return;
  var e = {id:uid("g"), ts:new Date().toISOString(), role:ROLE||"", txt:txt};
  S.log.push(e);
  if(DB) DB.collection("log").doc(e.id).set(e).catch(function(){});
  if(S.log.length > 400){
    var old = S.log.slice(0, S.log.length-400);
    S.log = S.log.slice(-400);
    if(DB) old.forEach(function(o){ DB.collection("log").doc(o.id).delete().catch(function(){}); });
  }
  if(!DB) lsSet();
}
/* الاعتماد: السجل يبدأ "مسودة" — بعد الاعتماد يُقفل ولا يعدّله المتابع إلا بموافقة المالك */
function canEditRec(o){ return isOwner() || !o.locked; }
function recActions(col, o, editAct, delAct){
  var h = '<td class="rowact">';
  if(!o.locked){
    if(editAct) h += '<button class="linkbtn" data-act="'+editAct+'" data-id="'+o.id+'">تعديل</button>';
    h += '<button class="btn ghost sm" data-act="lock" data-col="'+col+'" data-id="'+o.id+'">اعتماد</button>';
  } else if(isOwner()){
    if(o.unlockReq) h += '<button class="btn sm" data-act="approve" data-col="'+col+'" data-id="'+o.id+'">فتح للتعديل</button>';
    else if(editAct) h += '<button class="linkbtn" data-act="'+editAct+'" data-id="'+o.id+'">تعديل</button>';
  } else {
    h += o.unlockReq ? '<span class="pill warn">بانتظار موافقة المالك</span>'
                     : '<button class="btn ghost sm" data-act="req" data-col="'+col+'" data-id="'+o.id+'">طلب تعديل</button>';
  }
  if(isOwner() && delAct) h += '<button class="linkbtn" data-act="'+delAct+'" data-id="'+o.id+'">حذف</button>';
  return h + '</td>';
}
function lockPill(o){
  return o.locked ? '<span class="pill acc">معتمد</span>' : '<span class="pill mute">مسودة</span>';
}
function pendingReqs(){
  var out = [];
  ["units","tenants","contracts","expenses"].forEach(function(col){
    S[col].forEach(function(o){ if(o.unlockReq) out.push({col:col, o:o}); });
  });
  return out;
}
function labelOf(col, obj){
  if(col==="payments"){ var c=byId("contracts",obj.contractId), u=c?byId("units",c.unitId):null; return (u?u.name+" — ":"")+dstr(obj.dueDate); }
  return obj.name || obj.body || obj.cat || obj.id;
}
function setRole(r){
  ROLE = r;
  try{ r ? localStorage.setItem("ijar-role", r) : localStorage.removeItem("ijar-role"); }catch(e){}
  tab = "dash";
  render();
}
function cfg(){ return S.settings.find(function(x){return x.id==="app";}) || {}; }
function getPin(){ var p = cfg().pin; return p ? String(p) : ""; }
function getVPin(){ var p = cfg().vpin; return p ? String(p) : ""; }
function setPins(pin, vpin){
  var c = cfg();
  save("settings", {id:"app", pin:String(pin!=null?pin:(c.pin||"")), vpin:String(vpin!=null?vpin:(c.vpin||""))});
}

function uid(p){ return p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function lsGet(){ try{ var r = localStorage.getItem("ijar-v1"); if(r){ var o = JSON.parse(r); COLS.forEach(function(c){ if(Array.isArray(o[c])) S[c]=o[c]; }); } }catch(e){} }
function lsSet(){ try{ localStorage.setItem("ijar-v1", JSON.stringify(S)); }catch(e){} }

var SKIP_LOG = false;
function save(col, obj){
  var a = S[col], i = a.findIndex(function(x){return x.id===obj.id;});
  if(COL_AR[col] && !SKIP_LOG){
    if(col==="payments") logAct((obj.paid?"سجّل سداد ":"ألغى سداد ")+labelOf(col,obj)+" — "+money(obj.amount));
    else logAct((i<0?"أضاف ":"عدّل ")+COL_AR[col]+": "+labelOf(col,obj));
  }
  if(i<0) a.push(obj); else a[i]=obj;
  if(DB){ DB.collection(col).doc(obj.id).set(obj).catch(function(e){ toast("تعذّر الحفظ في السحابة: "+e.code); }); }
  else lsSet();
  render();
}
function remove(col, id){
  var o = byId(col, id);
  if(COL_AR[col] && o && col!=="payments") logAct("حذف "+COL_AR[col]+": "+labelOf(col,o));
  S[col] = S[col].filter(function(x){return x.id!==id;});
  if(DB){ DB.collection(col).doc(id).delete().catch(function(){}); } else lsSet();
  render();
}
function saveMany(col, arr){ arr.forEach(function(o){
  var a=S[col], i=a.findIndex(function(x){return x.id===o.id;}); if(i<0)a.push(o); else a[i]=o;
  if(DB) DB.collection(col).doc(o.id).set(o).catch(function(){});
});
  if(!DB) lsSet(); render();
}

/* ---------- أدوات ---------- */
var SAR = new Intl.NumberFormat("ar-SA-u-nu-latn",{maximumFractionDigits:0});
function money(n){ return SAR.format(Math.round(n||0)) + " ر.س"; }
function today(){ return new Date().toISOString().slice(0,10); }
function dstr(s){ if(!s) return "—"; var d=new Date(s+"T00:00:00"); return d.toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{year:"numeric",month:"short",day:"numeric"}); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function addMonths(iso,m){ var d=new Date(iso+"T00:00:00"); var day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m); var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return d.toISOString().slice(0,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function byId(col,id){ return S[col].find(function(x){return x.id===id;}) || null; }

var CYCLE = {monthly:{label:"شهري",m:1}, quarterly:{label:"ربع سنوي",m:3}, semi:{label:"نصف سنوي",m:6}, yearly:{label:"سنوي",m:12}};
var UTYPE = {room:"غرفة", shop:"محل تجاري", apt:"شقة", office:"مكتب"};
var EXPCAT = ["صيانة","كهرباء ومياه","نظافة","رسوم بلدية","تأمين","أخرى"];

function activeContract(unitId){
  var t = today();
  return S.contracts.find(function(c){ return c.unitId===unitId && c.start<=t && c.end>=t; }) || null;
}
function payStatus(p){
  if(p.paid) return {k:"ok", t:"مسدّدة"};
  var d = daysBetween(today(), p.dueDate);
  if(d < 0) return {k:"bad", t:"متأخرة " + Math.abs(d) + " يوم"};
  if(d <= 14) return {k:"warn", t:"تستحق خلال " + d + " يوم"};
  return {k:"mute", t:"قادمة"};
}
function genSchedule(c){
  var out=[], step = CYCLE[c.cycle].m, cur = c.start, n=0;
  while(cur <= c.end && n < 120){
    out.push({id:uid("p"), contractId:c.id, dueDate:cur, amount:Math.round(c.rent*step/12), paid:false, paidDate:""});
    cur = addMonths(cur, step); n++;
  }
  return out;
}

/* ---------- بيانات تجريبية ---------- */
function seed(){
  var u = [
    {id:"u-1", name:"محل رقم 1", type:"shop", building:"عمارة الروضة", area:48, rent:60000, note:"واجهة رئيسية"},
    {id:"u-2", name:"محل رقم 2", type:"shop", building:"عمارة الروضة", area:36, rent:45000, note:""},
    {id:"u-3", name:"غرفة 101", type:"room", building:"عمارة الروضة", area:18, rent:12000, note:"دور أول"},
    {id:"u-4", name:"غرفة 102", type:"room", building:"عمارة الروضة", area:18, rent:12000, note:""},
    {id:"u-5", name:"غرفة 201", type:"room", building:"عمارة الروضة", area:20, rent:13200, note:"شاغرة حالياً"}
  ];
  var t = [
    {id:"t-1", name:"مؤسسة النخبة للتجارة", phone:"0555000111", idNo:"4030xxxxxx", note:"سجل تجاري"},
    {id:"t-2", name:"صيدلية الوفاء", phone:"0555000222", idNo:"4030xxxxxx", note:""},
    {id:"t-3", name:"عبدالله محمد", phone:"0555000333", idNo:"10xxxxxxxx", note:""},
    {id:"t-4", name:"سالم أحمد", phone:"0555000444", idNo:"10xxxxxxxx", note:""}
  ];
  var y = new Date().getFullYear();
  var c = [
    {id:"c-1", unitId:"u-1", tenantId:"t-1", start:y+"-01-01", end:(y+1)+"-12-31", rent:60000, cycle:"quarterly", deposit:15000, note:""},
    {id:"c-2", unitId:"u-2", tenantId:"t-2", start:y+"-03-01", end:(y+1)+"-02-28", rent:45000, cycle:"semi", deposit:10000, note:""},
    {id:"c-3", unitId:"u-3", tenantId:"t-3", start:y+"-02-01", end:(y+1)+"-01-31", rent:12000, cycle:"monthly", deposit:1000, note:""},
    {id:"c-4", unitId:"u-4", tenantId:"t-4", start:y+"-05-01", end:(y+1)+"-04-30", rent:12000, cycle:"monthly", deposit:1000, note:""}
  ];
  var p = [];
  c.forEach(function(x){ p = p.concat(genSchedule(x)); });
  var tdy = today();
  p.forEach(function(x){ if(x.dueDate < tdy && Math.random() > .28){ x.paid = true; x.paidDate = x.dueDate; } });
  var e = [
    {id:"e-1", unitId:"u-1", date:addMonths(tdy,-1), cat:"صيانة", amount:2400, note:"إصلاح تكييف"},

/* ---------- إحصاءات ---------- */
function stats(){
  var t = today(), ym = t.slice(0,7);
  var occupied = S.units.filter(function(u){ return activeContract(u.id); }).length;
  var overdue = S.payments.filter(function(p){ return !p.paid && p.dueDate < t; });
  var dueSoon = S.payments.filter(function(p){ return !p.paid && p.dueDate >= t && daysBetween(t,p.dueDate) <= 30; });
  var collectedM = S.payments.filter(function(p){ return p.paid && (p.paidDate||"").slice(0,7)===ym; }).reduce(function(a,p){return a+p.amount;},0);
  var expM = S.expenses.filter(function(e){ return (e.date||"").slice(0,7)===ym; }).reduce(function(a,e){return a+e.amount;},0);
  var annual = S.contracts.filter(function(c){ return c.start<=t && c.end>=t; }).reduce(function(a,c){return a+c.rent;},0);
  var expiring = S.contracts.filter(function(c){ var d=daysBetween(t,c.end); return d>=0 && d<=90; });
  return {occupied:occupied, vacant:S.units.length-occupied, overdue:overdue, dueSoon:dueSoon,
          overdueSum:overdue.reduce(function(a,p){return a+p.amount;},0),
          collectedM:collectedM, expM:expM, annual:annual, expiring:expiring};
}

/* ---------- الشاشات ---------- */
function render(){
  var v = document.getElementById("view");
  document.querySelector(".side").style.display = ROLE ? "" : "none";
  document.querySelector(".shell").style.gridTemplateColumns = ROLE ? "" : "1fr";
  document.getElementById("tabbar").style.display = ROLE ? "" : "none";
  if(!ROLE){ v.innerHTML = vGate(); return; }
  drawNav();
  var map = {dash:vDash, units:vUnits, contracts:vContracts, pay:vPay, exp:vExp, tickets:vTickets, rep:vRep, log:vLog, set:vSettings};
  if(!isOwner() && (tab==="set" || tab==="log")) tab = "dash";
  v.innerHTML = (map[tab] || map.dash)();
  var who = document.getElementById("whoTxt");
  if(who) who.textContent = isOwner() ? "المالك / المدير" : "المتابع — إدخال ومتابعة";
}

function vRep(){
  var h = head("التقارير","صافي الدخل لكل وحدة والتحصيل الشهري");
  if(!S.units.length) return h + seedBanner() + '<div class="panel"><div class="empty">أضف وحدات لعرض التقارير.</div></div>';
  var y = new Date().getFullYear();
  var rows = S.units.map(function(u){
    var cs = S.contracts.filter(function(c){return c.unitId===u.id;});
    var collected = S.payments.filter(function(p){ var c=byId("contracts",p.contractId); return p.paid && c && c.unitId===u.id && (p.paidDate||"").slice(0,4)==String(y); }).reduce(function(a,p){return a+p.amount;},0);
    var due = S.payments.filter(function(p){ var c=byId("contracts",p.contractId); return !p.paid && c && c.unitId===u.id && p.dueDate < today(); }).reduce(function(a,p){return a+p.amount;},0);
    var exp = S.expenses.filter(function(e){ return e.unitId===u.id && (e.date||"").slice(0,4)==String(y); }).reduce(function(a,e){return a+e.amount;},0);
    return {u:u, collected:collected, due:due, exp:exp, net:collected-exp, cs:cs.length};
  });
  var maxNet = Math.max.apply(null, rows.map(function(r){return Math.max(r.net,1);}));
  h += '<div class="panel"><header><h2>صافي الدخل لكل وحدة — '+y+'</h2></header><div class="scroll"><table><thead><tr>'
    + '<th>الوحدة</th><th>المحصّل</th><th>المتأخر</th><th>المصروفات</th><th>الصافي</th><th style="width:150px">مقارنة</th></tr></thead><tbody>'
    + rows.map(function(r){
      var w = Math.max(0, r.net/maxNet*100);
      return '<tr><td><b>'+esc(r.u.name)+'</b></td><td class="num">'+money(r.collected)+'</td>'
        + '<td class="num" style="color:'+(r.due?"var(--danger)":"inherit")+'">'+money(r.due)+'</td>'
        + '<td class="num">'+money(r.exp)+'</td><td class="num"><b>'+money(r.net)+'</b></td>'
        + '<td><div class="occ" style="margin:0"><i style="width:'+w+'%;background:var(--accent)"></i></div></td></tr>';
    }).join("")
    + '</tbody></table></div></div>';

  var months = [];
  for(var i=11;i>=0;i--){ months.push(addMonths(today(), -i).slice(0,7)); }
  var mv = months.map(function(m){
    return {m:m,
      inc:S.payments.filter(function(p){return p.paid && (p.paidDate||"").slice(0,7)===m;}).reduce(function(a,p){return a+p.amount;},0),
      exp:S.expenses.filter(function(e){return (e.date||"").slice(0,7)===m;}).reduce(function(a,e){return a+e.amount;},0)};
  });
  var mx = Math.max.apply(null, mv.map(function(x){return Math.max(x.inc,x.exp,1);}));
  h += '<div class="panel"><header><h2>التحصيل والمصروفات — آخر ١٢ شهراً</h2></header><div class="scroll" style="padding:16px">'
    + '<div style="display:flex;align-items:flex-end;gap:9px;height:170px;min-width:520px">'
    + mv.map(function(x){
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">'
          + '<div style="display:flex;align-items:flex-end;gap:3px;height:130px;width:100%;justify-content:center">'
          + '<i title="محصّل" style="display:block;width:42%;background:var(--accent);border-radius:3px 3px 0 0;height:'+(x.inc/mx*100)+'%"></i>'
          + '<i title="مصروف" style="display:block;width:42%;background:var(--warn);border-radius:3px 3px 0 0;height:'+(x.exp/mx*100)+'%"></i>'
          + '</div><span class="num" style="font-size:10.5px;color:var(--ink-3)">'+x.m.slice(5)+'</span></div>';
      }).join("")
    + '</div><div class="legend"><span><i style="background:var(--accent)"></i>المحصّل</span><span><i style="background:var(--warn)"></i>المصروفات</span><span style="color:var(--ink-3)">أعلى قيمة: '+money(mx)+'</span></div>'
    + '</div></div>';

  h += '<div class="bar"><button class="btn ghost sm" data-act="csv">تصدير الدفعات (CSV)</button><button class="btn ghost sm" data-act="print">طباعة التقرير</button></div>';
  return h;
}

  }

    e.preventDefault();

  });
  host.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeModal); });

document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act]"); if(!b) return;
  var a = b.getAttribute("data-act"), id = b.getAttribute("data-id");
  var OWNER_ONLY = ["seed","delUnit","delTenant","delContract","delExp","delTicket","clear","savePin","approve"];
  if(!isOwner() && OWNER_ONLY.indexOf(a) >= 0){ toast("هذا الإجراء للمالك فقط."); return; }
  var col = b.getAttribute("data-col");
  if(a==="lock" || a==="req" || a==="approve"){
    var rec = byId(col, id); if(!rec) return;
    if(a==="lock"){
      if(!confirm("اعتماد هذا السجل؟ بعد الاعتماد لن تتمكن من تعديله إلا بموافقة المالك.")) return;
      rec.locked = true; rec.unlockReq = false; logAct("اعتمد "+COL_AR[col]+": "+labelOf(col,rec));
    } else if(a==="req"){
      rec.unlockReq = true; logAct("طلب فتح "+COL_AR[col]+" للتعديل: "+labelOf(col,rec)); toast("أُرسل الطلب للمالك.");
    } else {
      rec.locked = false; rec.unlockReq = false; logAct("وافق على فتح "+COL_AR[col]+": "+labelOf(col,rec));
    }
    SKIP_LOG = true; save(col, rec); SKIP_LOG = false; return;
  }
  if(a==="editContract"){ var c = byId("contracts", id);
    if(c && !canEditRec(c)){ toast("العقد معتمد — اطلب فتحه للتعديل."); return; } contractForm(c); return; }
  if(a==="editExp"){ var x = byId("expenses", id);
    if(x && !canEditRec(x)){ toast("المصروف معتمد — اطلب فتحه للتعديل."); return; } expForm(x); return; }
  if(a==="login"){
    var val = (document.getElementById("pinIn").value||"").trim();
    if(!getPin()){
      if(val.length < 4){ toast("اختر رمزاً من ٤ خانات على الأقل."); return; }
      setPins(val, ""); setRole("manager"); toast("تم تعيين رمز المدير. أضف رمز المتابع من الإعدادات.");
    } else if(val === getPin()){ setRole("manager"); }
    else if(getVPin() && val === getVPin()){ setRole("viewer"); }
    else { toast("رمز غير صحيح."); }
    return;
  }
  if(a==="switch"){ setRole(null); return; }
  if(a==="savePin"){
    var np = (document.getElementById("newPin").value||"").trim();
    var nv = (document.getElementById("newVPin").value||"").trim();
    if(np.length < 4){ toast("رمز المدير يجب أن يكون ٤ خانات على الأقل."); return; }
    if(nv && nv.length < 4){ toast("رمز المتابع يجب أن يكون ٤ خانات على الأقل."); return; }
    if(nv && nv === np){ toast("الرمزان يجب أن يختلفا."); return; }
    setPins(np, nv); toast("تم حفظ الرموز."); return;
  }
  if(a==="newTicket"){ ticketForm(); return; }
  if(a==="tkNext"){
    var tk = byId("tickets", id); if(!tk) return;
    tk.status = tk.status==="open" ? "doing" : tk.status==="doing" ? "done" : "open";
    save("tickets", tk); return;
  }
  if(a==="delTicket"){ if(confirm("حذف هذا البلاغ؟")) remove("tickets", id); return; }
  if(a==="seed"){ seed(); render(); }
  else if(a==="newUnit") unitForm();
  else if(a==="editUnit"){ var uu = byId("units",id);
    if(uu && !canEditRec(uu)){ toast("الوحدة معتمدة — اطلب فتحها للتعديل."); return; } unitForm(uu); }
  else if(a==="delUnit"){ if(confirm("حذف هذه الوحدة؟")) remove("units",id); }
  else if(a==="newTenant") tenantForm();
  else if(a==="editTenant"){ var tt = byId("tenants",id);
    if(tt && !canEditRec(tt)){ toast("السجل معتمد — اطلب فتحه للتعديل."); return; } tenantForm(tt); }
  else if(a==="delTenant"){ if(confirm("حذف هذا المستأجر؟")) remove("tenants",id); }
  else if(a==="newContract") contractForm();
  else if(a==="delContract"){
    if(!confirm("حذف العقد ودفعاته غير المسدّدة؟")) return;
    S.payments.filter(function(p){return p.contractId===id && !p.paid;}).forEach(function(p){ remove("payments",p.id); });
    remove("contracts", id);
  }
  else if(a==="togglePay"){
    var p = byId("payments", id); if(!p) return;
    if(p.paid && !isOwner()){ toast("إلغاء سداد مسجّل يحتاج موافقة المالك."); return; }
    p.paid = !p.paid; p.paidDate = p.paid ? today() : "";
    save("payments", p);
  }
  else if(a==="newExp") expForm();
  else if(a==="delExp"){ if(confirm("حذف هذا المصروف؟")) remove("expenses",id); }
  else if(a==="print") window.print();
  else if(a==="clear"){ if(confirm("سيتم مسح كل البيانات نهائياً. متابعة؟")) clearAll(); }
  else if(a==="csv") exportCsv();
});

var TABLE = "ijar_records", SB = null, pulling = false;
function shimDB(sb){
  return { collection: function(col){ return {
    doc: function(id){ return {
      set: function(o){ return Promise.resolve(sb.from(TABLE).upsert({id:id, col:col, data:o})); },
      delete: function(){ return Promise.resolve(sb.from(TABLE).delete().eq("id", id)); }
    };}
  };}};
}
function pull(){
  if(!SB || pulling) return Promise.resolve();
  pulling = true;
  return Promise.resolve(SB.from(TABLE).select("id,col,data")).then(function(res){
    pulling = false;
    if(res.error){ setSync(false, "تعذّر الاتصال بالسحابة"); return; }
    COLS.forEach(function(c){ S[c] = []; });
    (res.data||[]).forEach(function(r){
      if(!S[r.col]) return;
      var o = Object.assign({}, r.data); o.id = r.id; S[r.col].push(o);
    });
    setSync(true, "متزامن مع السحابة");
    render();
  }).catch(function(){ pulling = false; setSync(false, "تعذّر الاتصال بالسحابة"); });
}
(function boot(){
  var CFG = window.IJAR_CONFIG || {};
  if(!window.supabase || !CFG.url || !CFG.key){ setSync(false,"محلي على هذا الجهاز — لم تُضبط إعدادات السحابة"); return; }
  try{
    SB = window.supabase.createClient(CFG.url, CFG.key);
    DB = shimDB(SB);
    setSync(false, "جارٍ التحميل…");
    pull().then(function(){
      SB.channel("ijar").on("postgres_changes", {event:"*", schema:"public", table:TABLE}, function(){ pull(); }).subscribe();
    });
  }catch(e){ setSync(false,"محلي على هذا الجهاز"); }
})();

function setSync(on, txt){
  var d = document.getElementById("dot"), s = document.getElementById("syncTxt");
  if(d) d.className = "dot" + (on?" on":"");
  if(s) s.textContent = txt;
}
})();
</script>
