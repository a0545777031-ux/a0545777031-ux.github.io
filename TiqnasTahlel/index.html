<!doctype html>

<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">

<style>
/* Layout: a grade ledger — header strip, tab rail, then summary tiles before detail tables and charts */
:root{
  --paper:#f4f6f2; --surface:#ffffff; --sunk:#eaeee8; --ink:#16231e; --muted:#5a6a63; --line:#d9e0da;
  --accent:#0d6650; --accent-ink:#ffffff; --gold:#b9800f;
  --g5:#1d7a4c; --g4:#5b9a2e; --g3:#c29a12; --g2:#d4741f; --g1:#c03a33;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1513; --surface:#161f1c; --sunk:#1c2723; --ink:#e4ebe7; --muted:#93a39c; --line:#2a3833;
  --accent:#3cbf93; --accent-ink:#06261c; --gold:#e2ab3c;
  --g5:#46c486; --g4:#93cf5a; --g3:#e6c14a; --g2:#f0964a; --g1:#f0675f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1513; --surface:#161f1c; --sunk:#1c2723; --ink:#e4ebe7; --muted:#93a39c; --line:#2a3833;
  --accent:#3cbf93; --accent-ink:#06261c; --gold:#e2ab3c;
  --g5:#46c486; --g4:#93cf5a; --g3:#e6c14a; --g2:#f0964a; --g1:#f0675f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:.98rem}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:42px;height:42px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.85rem}

.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--sunk)}
.drop p{margin:0}
.banner{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));padding:8px 14px;border-radius:8px;font-size:.92rem}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filter{display:flex;gap:8px;align-items:center;padding-bottom:6px}
select,input[type=text],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
input[type=number]{width:76px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:.82rem;color:var(--muted);letter-spacing:.02em}
.tile .v{font-family:var(--f-display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .s{font-size:.82rem;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chart{position:relative;height:300px}
.chart.tall{height:380px}

.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--sunk);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
td.name{white-space:normal;min-width:150px;font-weight:500}

.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;color:#fff}
.c5{background:var(--g5)}.c4{background:var(--g4)}.c3{background:var(--g3)}.c2{background:var(--g2)}.c1{background:var(--g1)}
:root .c3,:root .c4{color:#1a1a1a}
.t5{color:var(--g5)}.t4{color:var(--g4)}.t3{color:var(--g3)}.t2{color:var(--g2)}.t1{color:var(--g1);font-weight:700}
.absent{color:var(--muted)}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;min-width:140px;background:var(--sunk)}
.dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;cursor:pointer;text-align:right}
.scard:hover,.scard.on{border-color:var(--accent)}
.scard .row{display:flex;justify-content:space-between;font-size:.86rem}
.scard .big{font-family:var(--f-display);font-size:1.4rem;font-weight:800}

.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.cols2{grid-template-columns:1fr}}
ol.list{margin:0;padding-inline-start:20px;display:grid;gap:3px;font-size:.9rem}
ol.list li span{float:left;font-variant-numeric:tabular-nums}

.settings{display:grid;gap:10px}
.srow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:flex;gap:6px;align-items:center}
.meta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.meta-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.meta-h h2{font-size:1.2rem}
.meta dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:0}
.meta dt{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.meta dd{margin:0;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.9rem;display:flex;gap:8px;align-items:center}
.chip.merge{background:var(--sunk);font-weight:600}
.chip.merge input{accent-color:var(--accent);margin:0}
.chip small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.gtile{cursor:pointer;text-align:right;font:inherit;color:inherit}
.gtile:hover,.gtile.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.picked{border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--sunk);display:grid;gap:10px;min-width:0}
ol.cols{display:block;columns:2 260px;column-gap:28px}
ol.cols li{break-inside:avoid;padding-block:2px}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
table.lv th{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:.9rem;font-family:var(--f-display)}
table.lv th.sub{text-align:right}
table.lv td{text-align:center;border:1px solid var(--line)}
table.lv td.name{text-align:right}
table.lv tfoot td{font-weight:700;background:var(--sunk)}
.lvbtn{background:none;border:1px solid transparent;padding:2px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.lvbtn:hover{border-color:var(--accent)}
.lvbtn.on{background:var(--accent);color:var(--accent-ink);text-decoration:none}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.exf{display:grid;gap:4px;font-size:.88rem}
.exf input{width:100%}
.scope{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;gap:6px;margin:0}
.scope legend{font-size:.85rem;color:var(--muted);padding-inline:4px}
.paper{background:#fff;color:#1f2a26;border:1px solid var(--line);border-radius:4px;padding:18px 18px 22px;font-size:.78rem;display:grid;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lh{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;border-bottom:2px solid #0d6650;padding-bottom:8px}
.lh .b{font-weight:700}
.lh-logo{width:72px;height:60px;display:grid;place-items:center;border:1px dashed #b8c4be;border-radius:4px;color:#7a8a83}
.lh-logo img{max-width:72px;max-height:60px}
.lh-logo:has(img){border:0}
.pt{text-align:center;font-family:var(--f-display);font-weight:800;color:#0d6650;font-size:1rem}
.ps{text-align:center;font-weight:700}
.pbody{text-align:center;color:#5a6a63;padding:18px 6px;border:1px dashed #d4ddd8;border-radius:4px}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sig div{display:grid;gap:2px}
.rp-host{position:fixed;left:-20000px;top:0;direction:rtl;z-index:-1}
.rp-page{width:794px;height:1123px;background:#fff;color:#1f2a26;font-family:var(--f-body);padding:28px 44px 22px;box-sizing:border-box;display:flex;flex-direction:column;font-size:12px;line-height:1.5}
.rp-page .lh{font-size:12px;padding-bottom:8px}
.rp-page .rp-nologo{border:0}
.rp-body{flex:1;position:relative;overflow:hidden;padding-top:10px}
.rp-foot{text-align:center;color:#5a6a63;font-size:10px;padding-top:6px;border-top:1px solid #d4ddd8}
.rp-title{text-align:center;color:#0d6650;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.6}
.rp-sub{text-align:center;font-weight:700;font-size:14px;margin-bottom:10px}
.rp-h{color:#0d6650;font-family:var(--f-display);font-size:14px;margin:0;padding:10px 0 6px}
.rp-page table.rp-t{width:100%;border-collapse:collapse;font-size:11.5px;color:#1f2a26}
.rp-page .rp-t th{background:#0d6650;color:#fff;padding:4px 6px;border:1px solid #9aa8a1;text-align:center;font-weight:700;position:static;font-size:11.5px}
.rp-page .rp-t td{border:1px solid #9aa8a1;padding:3px 6px;text-align:center;white-space:normal}
.rp-page .rp-t .l{text-align:right}
.rp-page .rp-t tr.foot td{background:#e6eeea;font-weight:700}
.rp-img{padding:4px 0 6px}
.rp-note{margin:0;padding:2px 0}
.rp-dots{margin:0;padding:4px 0;color:#9aa8a1;overflow:hidden;white-space:nowrap}
.rp-sig{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding-top:22px}
.rp-sig div{display:grid;gap:6px}
.rp-sig b{font-size:13px}
.ver{display:inline-block;vertical-align:middle;font-family:var(--f-body);font-size:.72rem;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-inline-start:4px}
.appfoot{text-align:center;color:var(--muted);font-size:.8rem;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.h1ar{font-size:.95rem;color:var(--muted);font-weight:600;margin-inline-start:6px}
.nt .ntp{font-size:.82rem;gap:8px;line-height:1.7}
.nt .ntp .b{font-weight:700;color:#0d6650}
.nt .ntp table.lv th{font-size:.78rem;padding:4px}
.nt .ntp table.lv td{padding:4px;color:#1f2a26}
.nt .ntp .muted{color:#5a6a63}
.ntlv{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ntlv .pill{flex:none}
tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.rp-p{margin:0;padding:2px 0;font-size:12.5px}
.rp-page tr.tall td{height:40px}
.rp-fit{transform-origin:top right}
.rp-sig.two{grid-template-columns:1fr 1fr;padding-top:8px;padding-bottom:4px}
.rp-tsig{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-size:12.5px}
.rp-sig span{font-size:11.5px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;max-width:calc(100% - 32px);z-index:20;font-size:.9rem}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">ت</div>
      <div><h1>TiqnasTahlel <span class="h1ar">تقناس تحليل</span> <span class="ver" id="appVer" title="رقم الإصدار">الإصدار 1.2</span></h1><div class="muted" style="font-size:.88rem">تحليل نتائج الطلاب من إشعارات وكشوف نور: إكسل أو PDF</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="goExport" type="button">تصدير التقرير الرسمي</button>
      <button class="btn" id="copyBtn" type="button">نسخ جدول الطلاب</button>
      <button class="btn" id="clearBtn" type="button">مسح البيانات</button>
    </div>
  </header>

  <label class="drop" id="drop" for="fileIn">
    <div><p><strong>اسحب ملفات الإكسل أو PDF هنا أو اضغط للاختيار</strong></p>
    <p class="muted" style="font-size:.88rem">إكسل (xlsx أو xls أو csv) أو PDF. يمكنك رفع عدة ملفات (فصل لكل ملف أو لكل ورقة). الملفات تُقرأ على جهازك فقط ولا تُرفع لأي خادم.</p></div>
    <span class="btn primary">اختيار الملفات</span>
    <input type="file" id="fileIn" accept=".xlsx,.xls,.csv,.pdf" multiple hidden>
  </label>

  <div class="banner" id="sampleBanner">تعرض الصفحة الآن <strong>بيانات تجريبية</strong> لتوضيح طريقة العمل. ارفع ملفاتك لتحل محلها.</div>

  <section class="meta" id="meta" aria-label="بيانات المدرسة"></section>
  <div class="chips" id="chips" role="group" aria-label="اختيار الفصل"></div>

  <nav class="bar">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-v="overview" aria-selected="true">نظرة عامة</button>
      <button class="tab" role="tab" data-v="levels" aria-selected="false">توزيع المستويات</button>
      <button class="tab" role="tab" data-v="subjects" aria-selected="false">المواد</button>
      <button class="tab" role="tab" data-v="students" aria-selected="false">الطلاب</button>
      <button class="tab" role="tab" data-v="classes" aria-selected="false">مقارنة الفصول</button>
      <button class="tab" role="tab" data-v="notice" aria-selected="false">إشعار المعلمين</button>
      <button class="tab" role="tab" data-v="export" aria-selected="false">التقرير الرسمي</button>
      <button class="tab" role="tab" data-v="settings" aria-selected="false">الإعدادات</button>
    </div>
  </nav>

  <main id="view"></main>
</div>
<footer class="appfoot" id="appFoot">TiqnasTahlel · الإصدار 1.2 · تُحلَّل الملفات داخل متصفحك ولا تُرفع إلى أي خادم</footer>
<div class="toast" id="toast" hidden></div>

<script>
const APP_VER='1.2';
const AR='٠١٢٣٤٥٦٧٨٩';
const S={classes:[],subjects:[],sample:true,cls:'all',view:'overview',passPct:50,
  scale:[{label:'ممتاز',min:90},{label:'جيد جدًا',min:80},{label:'جيد',min:65},{label:'مقبول',min:50},{label:'ضعيف',min:0}],
  detail:null,pick:null,pickAll:null,sort:{k:'rank',d:1},q:'',weak:false};
const charts={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>n==null||isNaN(n)?'—':(Math.round(n*10)/10).toLocaleString('en-US');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,4200)}

/* ---------- grading ---------- */
function gradeIdx(p){for(let i=0;i<S.scale.length;i++) if(p>=S.scale[i].min) return i; return S.scale.length-1}
const gcls=i=>'c'+(5-i), tcls=i=>'t'+(5-i);
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const gcolors=()=>['--g5','--g4','--g3','--g2','--g1'].map(tok);

/* ---------- parsing ---------- */
function toNum(v){
  if(typeof v==='number') return isFinite(v)?v:undefined;
  let s=String(v??'').trim().replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace('٫','.');
  if(s==='') return undefined;
  if(/^(غ|غائب|غـ|غ\.|معفى|معفي|-|ـ)$/.test(s)) return null;
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):undefined;
}
const txt=v=>String(v??'').replace(/\s+/g,' ').trim();
const SKIP=/^(م|م\.|ر|رقم|الرقم|#|ت|تسلسل|التسلسل)$|هوية|سجل|السجل|مدني|ترتيب|جوال|هاتف|^الفصل$|^الصف$|ملاحظ|مجموع|نسبة|معدل|تقدير|متوسط|الحالة|النتيجة/;
const NOTNAME=/مدرس|مدرسة|معلم|المادة|مادة|مدير|قائد/;
function autoMax(vals){const m=Math.max(0,...vals);for(const c of [5,10,15,20,25,30,40,50,60,70,80,100]) if(m<=c) return c; return Math.ceil(m/10)*10}

function parseRows(rows){
  let best=null;
  for(let i=0;i<Math.min(rows.length,40);i++){
    (rows[i]||[]).forEach((cell,c)=>{
      const t=txt(cell); if(!/اسم/.test(t)||NOTNAME.test(t)||t.length>25) return;
      let sc=0; for(let j=i+1;j<Math.min(rows.length,i+20);j++){const v=txt((rows[j]||[])[c]); if(v.length>3&&toNum(v)===undefined) sc++}
      if(!best||sc>best.sc) best={i,c,sc};
    });
  }
  if(!best||best.sc<1) return null;
  const {i:h,c:nc}=best;
  // data starts at first row with a real name
  let start=h+1;
  while(start<rows.length){const v=txt((rows[start]||[])[nc]); if(v.length>2&&toNum(v)===undefined&&!/اسم/.test(v)) break; start++}
  const data=[];
  for(let r=start;r<rows.length;r++){
    const n=txt((rows[r]||[])[nc]);
    if(n.length<3||toNum(n)!==undefined||/المجموع|المتوسط|الإجمالي|عدد |نسبة|^اسم/.test(n)) continue;
    data.push(rows[r]);
  }
  const width=Math.max(...rows.slice(h,h+30).map(r=>(r||[]).length));
  const cols=[];
  for(let c=0;c<width;c++){
    if(c===nc) continue;
    let label=txt((rows[h]||[])[c]);
    for(let k=1;!label&&k<=2&&h-k>=0;k++) label=txt((rows[h-k]||[])[c]);
    let maxHint=null;
    for(let r=h+1;r<start;r++){const v=(rows[r]||[])[c]; const n=toNum(v); if(typeof n==='number') maxHint=n; else if(!label&&txt(v)) label=txt(v); else if(txt(v)){const m=txt(v).match(/(\d+)/); if(m) maxHint=+m[1]}}
    if(!label||SKIP.test(label)) continue;
    const vals=data.map(r=>toNum((r||[])[c]));
    const numeric=vals.filter(v=>v!==undefined).length;
    if(!data.length||numeric/data.length<0.6) continue;
    const nums=vals.filter(v=>typeof v==='number');
    if(nums.length&&Math.min(...nums)>1000) continue;
    cols.push({c,label,maxHint,nums});
  }
  if(!cols.length) return null;
  let cname='';
  for(let r=0;r<h&&!cname;r++) for(const cell of rows[r]||[]){const t=txt(cell); if(/الصف|الفصل/.test(t)&&t.length>6&&t.length<60){cname=t;break}}
  const students=data.map(r=>{const sc={};cols.forEach(col=>{const v=toNum((r||[])[col.c]); sc[col.label]=v===undefined?null:v}); return {name:txt(r[nc]),scores:sc}});
  return {students,cols,cname};
}

/* Noor period-notice format: one sheet per student */
const rawTxt=v=>String(v??'');
function findCell(rows,re,lim){lim=lim||rows.length;for(let r=0;r<Math.min(rows.length,lim);r++){const row=rows[r]||[];for(let c=0;c<row.length;c++) if(re.test(txt(row[c]))) return {r,c}}return null}
function rowVal(rows,r,c){const row=rows[r]||[];for(let k=0;k<row.length;k++){if(k===c) continue;const t=txt(row[k]);if(t&&t!==':'&&!/[:：]$/.test(t)) return t}return ''}
function metaOf(rows,label,lim){for(let r=0;r<Math.min(rows.length,lim||25);r++){const row=rows[r]||[];for(let c=0;c<row.length;c++) if(txt(row[c]).replace(/[:：]/g,'').trim()===label) return rowVal(rows,r,c)}return ''}
const cleanSub=s=>String(s).replace(/[* ]/g,' ').replace(/\s+/g,' ').trim();
function parseNotice(rows){
  const ns=findCell(rows,/^اسم\s*ال?طالب[ة]?\s*[:：]?$/); if(!ns) return null;
  const name=rowVal(rows,ns.r,ns.c); if(!name) return null;
  let h=-1,sc=-1,tc=-1,mc=-1;
  for(let r=ns.r;r<rows.length&&h<0;r++){const row=rows[r]||[];const i=row.findIndex(x=>txt(x)==='المادة');
    if(i>=0){h=r;sc=i;row.forEach((x,c)=>{const t=txt(x);if(t==='مجموع'||t==='المجموع') tc=c;if(/العظمى/.test(t)) mc=c})}}
  if(h<0||tc<0) return null;
  const scores={},maxes={};
  for(let r=h+1;r<rows.length;r++){const row=rows[r]||[];const s=cleanSub(row[sc]||'');
    if(!s) continue; if(/^المجموع/.test(s)) break;
    const v=toNum(row[tc]), m=mc>=0?toNum(row[mc]):undefined;
    scores[s]=v===undefined?null:v; if(typeof m==='number'&&m>0) maxes[s]=m;}
  if(!Object.keys(scores).length) return null;
  const ex={};
  [['المواظبة','att'],['السلوك المتميز','beh1'],['السلوك الإيجابي','beh2']].forEach(([k,key])=>{const f=findCell(rows,new RegExp(k));if(f){const n=toNum(rowVal(rows,f.r,f.c));if(typeof n==='number') ex[key]=n}});
  let school='';
  for(let r=0;r<Math.min(rows.length,18)&&!school;r++){const row=rows[r]||[];if(row.some(x=>{const t=txt(x);return t===':'||/[:：]$/.test(t)})) continue;
    for(const x of row){const t=txt(x);if(t&&t.length>3&&!/المملكة|وزارة|الإدارة|إشعار|تقرير|فترة|^[\d\-\s]+$/.test(t)){school=t;break}}}
  const reg=findCell(rows,/^الإدارة/,18), per=findCell(rows,/إشعار|فترة/,20);
  let principal='';const pc=findCell(rows,/(قائد|قائدة|مدير|مديرة)\s*المدرسة/);
  if(pc){const raw=rawTxt(rows[pc.r][pc.c]);principal=raw.split(/\n/).map(x=>x.trim()).filter(x=>x&&!/(قائد|قائدة|مدير|مديرة)\s*المدرسة/.test(x))[0]||raw.replace(/(قائد|قائدة|مدير|مديرة)\s*المدرسة[:：]?/,'').trim()||rowVal(rows,pc.r,pc.c)}
  return {name,id:metaOf(rows,'رقم الهوية',40),scores,maxes,ex,meta:{school,principal,region:reg?txt(rows[reg.r][reg.c]):'',
    grade:metaOf(rows,'الصف'),section:metaOf(rows,'الفصل'),year:metaOf(rows,'العام الدراسي'),term:metaOf(rows,'الفصل الدراسي'),dept:metaOf(rows,'القسم'),period:per?txt(rows[per.r][per.c]):''}};
}
function addNotice(res){
  const m=res.meta, key=[m.school,m.grade,m.section].join('|');
  let cl=S.classes.find(c=>c.key===key);
  if(!cl){cl={key,name:(m.grade||'فصل')+(m.section?' / '+m.section:''),meta:m,students:[]};
    if(S.classes.some(c=>c.name===cl.name)) cl.name+=' — '+(m.school||'');
    S.classes.push(cl)}
  const dup=res.id?cl.students.findIndex(s=>s.id===res.id):-1;
  const stu={name:res.name,id:res.id,scores:res.scores,ex:res.ex};
  if(dup>=0) cl.students[dup]=stu; else cl.students.push(stu);
  Object.keys(res.scores).forEach(l=>{let s=S.subjects.find(x=>x.label===l);const mx=res.maxes[l]||autoMax([res.scores[l]||0]);
    if(!s) S.subjects.push({label:l,max:mx,on:true}); else if(res.maxes[l]) s.max=Math.max(s.max,mx)});
}

function addParsed(name,res){
  res.cols.forEach(col=>{
    let s=S.subjects.find(x=>x.label===col.label);
    const am=col.maxHint&&col.maxHint>=Math.max(0,...col.nums)?col.maxHint:autoMax(col.nums);
    if(!s) S.subjects.push({label:col.label,max:am,on:true}); else s.max=Math.max(s.max,am);
  });
  let nm=res.cname||name, k=2; while(S.classes.some(c=>c.name===nm)) nm=(res.cname||name)+' ('+(k++)+')';
  S.classes.push({key:nm,name:nm,meta:{grade:res.cname||''},students:res.students});
}

/* ---------- PDF input ---------- */
const PDFLIB={main:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',worker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'};
const KNOWN_SUBJ=['القرآن الكريم والدراسات الإسلامية','القرآن الكريم','الدراسات الإسلامية','التوحيد','الفقه','الحديث','التفسير','اللغة العربية','لغتي','لغتي الخالدة','الرياضيات','العلوم','اللغة الانجليزية','اللغة الإنجليزية','الدراسات الاجتماعية','الاجتماعيات','المهارات الرقمية','التفكير الناقد','التربية الفنية','التربية البدنية والدفاع عن النفس','التربية البدنية','المهارات الحياتية والأسرية','النشاط','الفيزياء','الكيمياء','الأحياء','علوم الأرض والفضاء','التقنية الرقمية'];
function nz(s){return String(s??'').normalize('NFKC').replace(/[\u0000-\u001f​-‏‪-‮⁦-⁩]/g,'').replace(/اإل/g,'الإ').replace(/األ/g,'الأ').replace(/اآل/g,'الآ').replace(/\s+/g,' ').trim()}
const akey=s=>[...nz(s).replace(/[\s*ـ:：،,.\-()]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')].sort().join('');
const isNumT=t=>/^-?\d+(\.\d+)?$/.test(t);
function canonSub(t){t=cleanSub(t);const k=akey(t);const hit=[...S.subjects.map(s=>s.label),...KNOWN_SUBJ].find(x=>akey(x)===k);return hit||t}
function pdfLines(pages){
  const lines=[];
  pages.forEach((pg,pi)=>{
    const its=pg.items.map(i=>({t:nz(i.str),x:i.x,w:Math.max(0,i.w),y:i.y})).filter(i=>i.t).sort((a,b)=>a.y-b.y);
    const ls=[];
    its.forEach(it=>{let L=ls.find(l=>Math.abs(l.y-it.y)<=3.5);if(!L){L={y:it.y,items:[]};ls.push(L)}L.items.push(it)});
    ls.sort((a,b)=>a.y-b.y).forEach(L=>{
      const cells=[];
      L.items.sort((a,b)=>(b.x+b.w)-(a.x+a.w)).forEach(it=>{
        const last=cells[cells.length-1], gap=last?last.x-(it.x+it.w):99;
        const joinable=last&&!isNumT(it.t)&&!isNumT(last.t)&&it.t!==':'&&last.t!==':'&&gap>-3&&gap<4.5;
        if(joinable){last.t=last.t+(gap>0.9?' ':'')+it.t;last.x=Math.min(last.x,it.x)}
        else cells.push({t:it.t,x:it.x,r:it.x+it.w});
      });
      cells.forEach(c=>{c.t=nz(c.t);c.xc=(c.x+c.r)/2});
      lines.push({y:L.y+pi*100000,page:pi,cells,pw:pg.w});
    });
  });
  return lines;
}
function lblVal(L,c){const o=L.cells.filter(x=>x!==c&&x.t!==':'&&akey(x.t));const left=o.filter(x=>x.xc<c.xc).sort((a,b)=>b.xc-a.xc);return (left[0]||o[0]||{t:''}).t}
function pdfNotices(lines){
  const NK=[akey('اسم الطالب'),akey('اسم الطالبة')];
  const nameIdx=[];lines.forEach((L,i)=>{if(L.cells.some(c=>NK.includes(akey(c.t))))nameIdx.push(i)});
  const pageStart=p=>lines.findIndex(L=>L.page===p);
  return nameIdx.map((ni,k)=>{
    const start=Math.max(k?nameIdx[k-1]+1:0,pageStart(lines[ni].page));
    const nx=nameIdx[k+1];
    const end=nx==null?lines.length:(lines[nx].page===lines[ni].page?nx:pageStart(lines[nx].page));
    const B=lines.slice(start,end), top=lines.slice(start,ni+1);
    const find=(test,arr)=>{for(const L of (arr||B)) for(const c of L.cells) if(test(c)) return {L,c};return null};
    const lbl=label=>{const k=akey(label);const f=find(c=>akey(c.t)===k);return f?lblVal(f.L,f.c):''};
    const nf=find(c=>NK.includes(akey(c.t)));const name=nf?lblVal(nf.L,nf.c):'';
    if(!name) return null;
    // subjects table
    const hf=find(c=>akey(c.t)===akey('المادة'));
    const scores={},maxes={};
    if(hf){
      const hy=hf.L.y, near=B.filter(L=>Math.abs(L.y-hy)<=34);
      const anc=re=>{for(const L of near) for(const c of L.cells) if(re(c)) return c.xc;return null};
      const sx=hf.c.xc, tx=anc(c=>akey(c.t)===akey('مجموع')), mx=anc(c=>/العظمى|النهاية/.test(c.t));
      if(tx!=null){
        for(const L of B){
          if(L.y<=hy) continue;
          const nums=L.cells.filter(c=>isNumT(c.t));
          const txt=L.cells.filter(c=>!isNumT(c.t)&&c.t!==':'&&Math.abs(c.xc-sx)<80).sort((a,b)=>Math.abs(a.xc-sx)-Math.abs(b.xc-sx));
          if(txt[0]&&akey(txt[0].t)===akey('المجموع')) break;
          const near1=x=>x==null?null:nums.filter(c=>Math.abs(c.xc-x)<14).sort((a,b)=>Math.abs(a.xc-x)-Math.abs(b.xc-x))[0];
          const tc=near1(tx), mc=near1(mx);
          if(!tc&&!mc) continue;
          let label=txt[0]?txt[0].t:'';
          if(!label){label=B.filter(W=>Math.abs(W.y-L.y)<=10&&W!==L&&!W.cells.some(c=>isNumT(c.t))).sort((a,b)=>a.y-b.y)
            .map(W=>W.cells.filter(c=>Math.abs(c.xc-sx)<80).map(c=>c.t).join(' ')).filter(Boolean).join(' ')}
          if(!label) continue;
          const lab=canonSub(label);
          scores[lab]=tc?+tc.t:null; if(mc&&+mc.t>0) maxes[lab]=+mc.t;
        }
      }
    }
    if(!Object.keys(scores).length) return null;
    const ex={};
    [[/المواظبة/,'att'],[/السلوك المتميز|المتميز/,'beh1'],[/السلوك الإيجابي|الإيجابي/,'beh2']].forEach(([re,key])=>{const f=find(c=>re.test(c.t));if(f){const cand=B.filter(W=>Math.abs(W.y-f.L.y)<=12).sort((a,b)=>Math.abs(a.y-f.L.y)-Math.abs(b.y-f.L.y));
      for(const W of cand){const n=W.cells.find(c=>isNumT(c.t)&&c.xc<f.c.xc);if(n){ex[key]=+n.t;break}}}});
    let school=(find(c=>/^(متوسطة|ابتدائية|ثانوية|مدرسة|المدرسة|مجمع|معهد|روضة|مدارس)/.test(c.t),top)||{c:{t:''}}).c.t;
    if(!school){for(const L of top){if(L.cells.some(c=>c.t===':'||/:$/.test(c.t))) continue;for(const c of L.cells) if(c.xc>(L.pw||600)*0.5&&c.t.length>3&&!isNumT(c.t)&&!/المملكة|وزارة|الإدارة|إشعار|فترة|فرتة|تقرير/.test(c.t)) school=c.t}}
    const reg=find(c=>/^الإدارة/.test(c.t),top), per=find(c=>/إشعار|فترة|فرتة/.test(c.t),top);
    let principal='';const pf=find(c=>/(قائد|قائدة|مدير|مديرة)\s*المدرسة/.test(c.t));
    if(pf){principal=pf.c.t.replace(/(قائد|قائدة|مدير|مديرة)\s*المدرسة[:：]?/,'').trim();
      if(principal.length<4){principal='';for(const L of B){if(L.y<=pf.L.y||L.y>pf.L.y+40) continue;const c=L.cells.filter(c=>!isNumT(c.t)&&c.t.length>3).sort((a,b)=>Math.abs(a.xc-pf.c.xc)-Math.abs(b.xc-pf.c.xc))[0];if(c&&Math.abs(c.xc-pf.c.xc)<110){principal=c.t;break}}}}
    return {name,id:lbl('رقم الهوية'),scores,maxes,ex,meta:{school,principal,region:reg?reg.c.t:'',grade:lbl('الصف'),section:lbl('الفصل'),year:lbl('العام الدراسي'),term:lbl('الفصل الدراسي'),dept:lbl('القسم'),period:per?per.c.t.replace('فرتة','فترة'):''}};
  }).filter(Boolean);
}
function pdfTableRows(lines){
  const h=lines.find(L=>L.cells.some(c=>/اسم/.test(c.t)&&!/مدرس|معلم|المادة/.test(c.t)));
  if(!h) return null;
  const anc=h.cells.slice().sort((a,b)=>b.xc-a.xc);
  return lines.map(L=>{const row=Array(anc.length).fill('');
    L.cells.forEach(c=>{let bi=0,bd=1e9;anc.forEach((a,i)=>{const d=Math.abs(a.xc-c.xc);if(d<bd){bd=d;bi=i}});row[bi]=row[bi]?row[bi]+' '+c.t:c.t});
    return row.map(v=>isNumT(v)?+v:v)});
}
async function readPdfPages(buf){
  await loadScript(PDFLIB.main);await loadScript(PDFLIB.worker);
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFLIB.worker;
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);const vp=p.getViewport({scale:1});const tc=await p.getTextContent();
    pages.push({w:vp.width,items:tc.items.filter(it=>it.str).map(it=>({str:it.str,x:it.transform[4],y:vp.height-it.transform[5],w:it.width}))})}
  return pages;
}

async function handleFiles(files){
  if(S.sample){S.classes=[];S.subjects=[];S.sample=false}
  let added=0;
  for(const f of files){
    if(/\.pdf$/i.test(f.name)){
      try{
        const pages=await readPdfPages(await f.arrayBuffer());
        if(!pages.some(p=>p.items.length)){toast('«'+f.name+'» صورة ممسوحة ضوئيًا بلا نص قابل للقراءة. صدّر التقرير من نور بصيغة PDF أو إكسل.');continue}
        const lines=pdfLines(pages), ns=pdfNotices(lines);
        if(ns.length){ns.forEach(addNotice);added+=ns.length;continue}
        const rows=pdfTableRows(lines), res=rows&&parseRows(rows);
        if(res&&res.students.length){addParsed(f.name.replace(/\.[^.]+$/,''),res);added+=res.students.length}
        else toast('لم أجد كشف درجات في «'+f.name+'». تأكد أنه تقرير من نور فيه اسم الطالب ودرجات المواد.');
      }catch(e){console.error(e);toast(e&&e.message==='load'?'تعذّر تحميل قارئ PDF. تحقق من الاتصال ثم أعد المحاولة.':'تعذّرت قراءة «'+f.name+'». تأكد أنه ملف PDF سليم وغير محمي بكلمة مرور.')}
      continue;
    }
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const base=f.name.replace(/\.[^.]+$/,'');
      let got=0;
      wb.SheetNames.forEach(sn=>{
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:true});
        const nt=parseNotice(rows);
        if(nt){addNotice(nt);got++;added++;return}
        const res=parseRows(rows);
        if(res&&res.students.length){addParsed(wb.SheetNames.length>1?base+' — '+sn:base,res);got++;added+=res.students.length}
      });
      if(!got) toast('لم أجد كشف درجات في «'+f.name+'». تأكد أن فيه عمودًا عنوانه «اسم الطالب» وأعمدة درجات رقمية.');
    }catch(e){toast('تعذّرت قراءة «'+f.name+'». تأكد أنه ملف إكسل سليم.')}
  }
  if(added) toast('تمت إضافة '+added+' طالب.');
  S.cls='all'; render();
}

/* ---------- derived data ---------- */
const gname=g=>g==='all'?(VC().length===1?VC()[0].name:'جميع الفصول'):g;
function VC(){
  if(!S.merge) return S.classes;
  const map=new Map();
  S.classes.forEach(c=>{const m=c.meta||{};const k=(m.school||'')+'|'+(m.grade||c.name);
    if(!map.has(k)) map.set(k,{key:k,name:m.grade||c.name,meta:{...m},students:[],secs:[]});
    const g=map.get(k);g.secs.push(m.section||c.name);c.students.forEach(st=>g.students.push({...st,_cls:c.name}))});
  const out=[...map.values()];
  out.forEach(g=>{g.meta.section=g.secs.join('، ');if(g.secs.length>1) g.name+=' · الشعب '+g.secs.join(' و ')});
  out.forEach(g=>{if(out.filter(x=>x.name===g.name).length>1&&g.meta.school) g.name+=' — '+g.meta.school});
  return out;
}
const canMerge=()=>{const seen={};return S.classes.some(c=>{const m=c.meta||{};if(!m.grade) return false;const k=(m.school||'')+'|'+m.grade;if(seen[k]) return true;seen[k]=1;return false})};
const showCls=()=>(S.cls==='all'&&VC().length>1)||(S.merge&&S.classes.length>1);
const subs=()=>S.subjects.filter(s=>s.on);
function pct(stu,s){const v=stu.scores[s.label]; return v==null?null:v/s.max*100}
function students(){
  const list=[];VC().forEach(c=>{if(S.cls==='all'||S.cls===c.name) c.students.forEach(st=>list.push({...st,cls:st._cls||c.name}))});
  const ss=subs();
  list.forEach(st=>{
    const ps=ss.map(s=>pct(st,s)).filter(p=>p!=null);
    st.avg=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;
    st.fails=ss.filter(s=>{const p=pct(st,s);return p!=null&&p<S.passPct}).length;
  });
  const ranked=list.filter(s=>s.avg!=null).sort((a,b)=>b.avg-a.avg);
  ranked.forEach((s,i)=>s.rank=(i>0&&Math.abs(ranked[i-1].avg-s.avg)<1e-9)?ranked[i-1].rank:i+1);
  return list;
}
function stats(list,s){
  const ps=list.map(st=>pct(st,s)).filter(p=>p!=null).sort((a,b)=>a-b);
  const n=ps.length, absent=list.filter(st=>st.scores[s.label]===null||st.scores[s.label]===undefined).length;
  if(!n) return {n:0,absent,dist:[0,0,0,0,0]};
  const avg=ps.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(ps.reduce((a,b)=>a+(b-avg)**2,0)/n);
  const med=n%2?ps[(n-1)/2]:(ps[n/2-1]+ps[n/2])/2;
  const dist=[0,0,0,0,0]; ps.forEach(p=>dist[gradeIdx(p)]++);
  return {n,absent,avg,sd,med,min:ps[0],max:ps[n-1],pass:ps.filter(p=>p>=S.passPct).length/n*100,dist};
}
function pickPanel(title,rows){
  window._pick=rows;
  return `<div class="picked" id="picked"><div class="panel-h"><h3>${esc(title)} · ${rows.length} طالب</h3>
  <div class="srow"><button class="btn small" type="button" data-copy="names">نسخ الأسماء</button><button class="btn small" type="button" data-copy="full">نسخ مع الدرجات</button><button class="btn small" type="button" data-close>إغلاق</button></div></div>
  ${rows.length?`<ol class="list cols">${rows.map(r=>`<li>${esc(r.name)}${r.cls&&showCls()?' <small class="muted">'+esc(r.cls)+'</small>':''} <span class="${r.c||''}">${esc(r.val)}</span></li>`).join('')}</ol>`:'<p class="muted" style="margin:0">لا يوجد طلاب في هذه الشريحة.</p>'}</div>`;
}
function copyText(t,msg){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){} ta.remove();toast(ok?msg:'تعذّر النسخ من هذا المتصفح.')};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(fb); else fb();
}
function distBar(dist){const n=dist.reduce((a,b)=>a+b,0)||1;return '<div class="dist" title="'+S.scale.map((g,i)=>g.label+': '+dist[i]).join(' · ')+'">'+dist.map((d,i)=>d?`<span class="${gcls(i)}" style="width:${d/n*100}%"></span>`:'').join('')+'</div>'}
function legend(){return '<div class="legend">'+S.scale.map((g,i)=>`<span><i class="${gcls(i)}"></i>${g.label} (${g.min}${i?'–'+(S.scale[i-1].min-0.01):'–100'})</span>`).join('')+'</div>'}

/* ---------- charts ---------- */
function kill(){Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k]})}
function baseOpts(extra){
  const ink=tok('--muted'),line=tok('--line');
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily; Chart.defaults.color=ink;
  return Object.assign({responsive:true,maintainAspectRatio:false,animation:{duration:matchMedia('(prefers-reduced-motion:reduce)').matches?0:400},
    plugins:{legend:{display:false,rtl:true,labels:{boxWidth:12}},tooltip:{rtl:true,textDirection:'rtl'}},
    scales:{x:{grid:{color:line},ticks:{color:ink}},y:{grid:{color:line},ticks:{color:ink}}}},extra||{});
}
function scrollPick(){const p=document.getElementById('picked');if(p) p.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
function mkClickAvg(d){const c=charts.cAvg;if(!c) return;
  c.options.onClick=(e,els)=>{if(els.length){S.detail=d[els[0].index].s.label;S.pick=null;S.view='subjects';render()}};
  c.options.onHover=(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default'};c.update('none')}
function mk(id,cfg){const el=document.getElementById(id); if(el) charts[id]=new Chart(el,cfg)}

function vSubjects(){
  const list=students(), ss=subs();
  if(!list.length) return '<div class="panel empty">لا توجد بيانات بعد.</div>';
  if(!S.detail||!ss.some(s=>s.label===S.detail)) S.detail=ss[0]?.label;
  const cards=ss.map(s=>{const x=stats(list,s); if(!x.n) return ''; const g=gradeIdx(x.avg);
    return `<button class="scard ${S.detail===s.label?'on':''}" data-sub="${esc(s.label)}" type="button"><h3>${esc(s.label)}</h3>
    <div class="row"><span class="big ${tcls(g)}">${f1(x.avg)}٪</span><span class="pill ${gcls(g)}" style="align-self:center">${S.scale[g].label}</span></div>
    ${distBar(x.dist)}<div class="row muted"><span>نجاح ${f1(x.pass)}٪</span><span>${x.n} طالب · من ${s.max}</span></div></button>`}).join('');
  const s=ss.find(z=>z.label===S.detail);
  let det='';
  if(s){
    const x=stats(list,s);
    const sorted=list.filter(st=>pct(st,s)!=null).sort((a,b)=>pct(b,s)-pct(a,s));
    const fails=sorted.filter(st=>pct(st,s)<S.passPct).reverse();
    const raw=st=>f1(st.scores[s.label]);
    let pickHtml='';
    if(S.pick&&S.pick.sub===s.label){
      const i=S.pick.i, bin=S.pick.type==='bin';
      const inIt=p=>bin?Math.min(9,Math.floor(p/10))===i:gradeIdx(p)===i;

      pickHtml=pickPanel(s.label+': '+(bin?`من ${i*10}٪ إلى ${i*10+10}٪`:S.scale[i].label),rows);

    det=`<section class="panel"><div class="panel-h"><h2>${esc(s.label)}</h2><span class="muted num" style="font-size:.85rem">المتوسط ${f1(x.avg/100*s.max)} من ${s.max} · الانحراف ${f1(x.sd)}</span></div>
    <div class="grid2"><div><div class="chart"><canvas id="cHist"></canvas></div><div class="hint">عدد الطلاب في كل شريحة. اضغط على أي عمود لعرض أسماء طلابه.</div></div>
    <div style="display:grid;gap:10px;align-content:start">
      <div class="tiles" style="grid-template-columns:repeat(2,1fr)">${S.scale.map((g,i)=>`<button type="button" class="tile gtile ${S.pick&&S.pick.sub===s.label&&S.pick.type==='grade'&&S.pick.i===i?'on':''}" data-grade="${i}" style="padding:10px"><div class="k">${g.label}</div><div class="v ${tcls(i)}" style="font-size:1.25rem">${x.dist[i]} <span class="muted" style="font-size:.85rem;font-weight:500">(${f1(x.dist[i]/x.n*100)}٪)</span></div></button>`).join('')}</div>
      <div class="hint" style="margin:0">اضغط على أي تقدير لعرض طلابه.</div>
    </div></div>${pickHtml}
    <div class="cols2">
      <div><h3 style="margin-bottom:6px">الأعلى درجة</h3><ol class="list">${sorted.slice(0,7).map(st=>`<li>${esc(st.name)} <span class="t5">${raw(st)}</span></li>`).join('')}</ol></div>
      <div><h3 style="margin-bottom:6px">دون حد النجاح (${fails.length})</h3>${fails.length?`<ol class="list">${fails.map(st=>`<li>${esc(st.name)}${showCls()?' <small class="muted">'+esc(st.cls)+'</small>':''} <span class="t1">${raw(st)}</span></li>`).join('')}</ol>`:'<p class="muted" style="margin:0">لا يوجد طلاب دون حد النجاح.</p>'}</div>
    </div></section>`;
  }
  const html=`<section class="panel"><div class="panel-h"><h2>توزيع التقديرات لكل مادة</h2>${legend()}</div><div class="chart tall"><canvas id="cStack"></canvas></div></section>
  <div class="cards">${cards}</div>${det}`;
  return [html,()=>{
    const gc=gcolors(), d=ss.map(z=>({z,x:stats(list,z)})).filter(o=>o.x.n);
    mk('cStack',{type:'bar',data:{labels:d.map(o=>o.z.label),datasets:S.scale.map((g,i)=>({label:g.label,data:d.map(o=>+(o.x.dist[i]/o.x.n*100).toFixed(1)),backgroundColor:gc[i]}))},
      options:baseOpts({indexAxis:'y',plugins:{legend:{display:false},tooltip:{rtl:true,callbacks:{label:c=>c.dataset.label+': '+c.raw+'٪'}}},scales:{x:{stacked:true,min:0,max:100,reverse:true,grid:{color:tok('--line')}},y:{stacked:true,position:'right',grid:{display:false}}}})});
    if(s){

      mk('cHist',{type:'bar',data:{labels:bins.map((_,i)=>i*10+'–'+(i*10+10)),datasets:[{data:bins,backgroundColor:bins.map((_,i)=>gc[gradeIdx(i*10+5)]),borderRadius:3}]},

          onHover:(e,els)=>{e.native.target.style.cursor=els.length?'pointer':'default'},
          scales:{x:{reverse:true,grid:{display:false}},y:{position:'right',beginAtZero:true,ticks:{precision:0},grid:{color:tok('--line')}}}})});
    }
  }];
}

function studentsOf(name){const k=S.cls;S.cls=name;const l=students();S.cls=k;return l}
function vLevels(){
  const ss=subs();
  if(!VC().length) return '<div class="panel empty">لا توجد بيانات بعد.</div>';
  const groups=S.cls!=='all'?[S.cls]:(VC().length>1?['all',...VC().map(c=>c.name)]:[VC()[0].name]);
  window._lvTables={};
  return groups.map((g,gi)=>{
    const list=studentsOf(g);
    const hasAbs=ss.some(s=>list.some(st=>st.scores[s.label]==null));
    const rows=ss.map((s,si)=>{const d=[0,0,0,0,0];let ab=0;list.forEach(st=>{const p=pct(st,s);if(p==null) ab++;else d[gradeIdx(p)]++});return {s,si,d,ab}});
    const tot=[0,1,2,3,4].map(i=>rows.reduce((a,r)=>a+r.d[i],0));
    window._lvTables[gi]=[['المادة',...S.scale.map(x=>x.label),...(hasAbs?['غائب']:[])].join('\t'),...rows.map(r=>[r.s.label,...r.d,...(hasAbs?[r.ab]:[])].join('\t'))].join('\n');
    const cell=(n,si,i,cls)=>n?`<button type="button" class="lvbtn ${cls} ${S.lv&&S.lv.g===g&&S.lv.si===si&&S.lv.i===i?'on':''}" data-lv="${gi}|${si}|${i}">${n}</button>`:'<span class="muted">0</span>';
    let pick='';
    if(S.lv&&S.lv.g===g){
      const s=ss[S.lv.si], i=S.lv.i;
      if(s){const sel=list.filter(st=>{const p=pct(st,s);return i===-1?p==null:p!=null&&gradeIdx(p)===i})
        .sort((a,b)=>(pct(b,s)??-1)-(pct(a,s)??-1))
        .map(st=>{const v=st.scores[s.label];return {name:st.name,cls:st.cls,val:v==null?'غائب':f1(v)+' / '+s.max,c:v==null?'muted':tcls(gradeIdx(pct(st,s)))}});
        pick=pickPanel(s.label+' · '+(i===-1?'غائب':S.scale[i].label),sel)}
    }
    const title=gname(g);
    return `<section class="panel"><div class="panel-h"><h2>توزيع الطلاب على المستويات · ${esc(title)}</h2>
      <div class="srow"><span class="muted" style="font-size:.85rem">${list.length} طالب</span><button class="btn small" type="button" data-lvcopy="${gi}">نسخ الجدول</button></div></div>
    <div class="tw"><table class="lv"><thead><tr><th class="sub">المادة</th>${S.scale.map(x=>`<th>${x.label}</th>`).join('')}${hasAbs?'<th>غائب</th>':''}</tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="name">${esc(r.s.label)}</td>${r.d.map((n,i)=>`<td>${cell(n,r.si,i,'')}</td>`).join('')}${hasAbs?`<td>${cell(r.ab,r.si,-1,'')}</td>`:''}</tr>`).join('')}
    </tbody><tfoot><tr><td class="name">المجموع</td>${tot.map(n=>`<td>${n}</td>`).join('')}${hasAbs?`<td>${rows.reduce((a,r)=>a+r.ab,0)}</td>`:''}</tr></tfoot></table></div>
    <div class="hint" style="margin:0">اضغط على أي رقم لعرض أسماء الطلاب ودرجاتهم.</div>${pick}</section>`;
  }).join('');
}

function vStudents(){
  const all=students(), ss=subs();
  if(!all.length) return '<div class="panel empty">لا توجد بيانات بعد.</div>';
  let list=all.filter(st=>(!S.q||st.name.includes(S.q))&&(!S.weak||st.fails>0));
  const k=S.sort.k,d=S.sort.d;
  list.sort((a,b)=>{let va,vb; if(k==='name'){return a.name.localeCompare(b.name,'ar')*d}
    if(k==='rank'){va=a.rank??1e9;vb=b.rank??1e9} else if(k==='fails'){va=a.fails;vb=b.fails} else {const s=ss.find(z=>z.label===k); va=s?pct(a,s)??-1:0; vb=s?pct(b,s)??-1:0; return (vb-va)*d}
    return (va-vb)*d});
  const multi=showCls();
  const hasEx=all.some(st=>st.ex&&Object.keys(st.ex).length);
  const th=(key,lab)=>`<th class="sort" data-k="${esc(key)}">${esc(lab)}${S.sort.k===key?(S.sort.d>0?' ▾':' ▴'):''}</th>`;
  return `<section class="panel"><div class="panel-h"><h2>نتائج الطلاب</h2>
    <div class="srow"><input type="text" id="q" placeholder="ابحث باسم الطالب" value="${esc(S.q)}"><label class="chk"><input type="checkbox" id="weak" ${S.weak?'checked':''}> المتعثرون فقط</label><span class="muted" style="font-size:.85rem">${list.length} طالب</span></div></div>
  <div class="tw"><table><thead><tr>${th('rank','الترتيب')}${th('name','الاسم')}${multi?'<th>الفصل</th>':''}${ss.map(s=>th(s.label,s.label+' /'+s.max)).join('')}${th('rank','المعدل ٪')}<th>التقدير</th>${th('fails','مواد دون النجاح')}${hasEx?'<th>المواظبة</th><th>السلوك المتميز</th><th>السلوك الإيجابي</th>':''}</tr></thead><tbody>
  ${list.map(st=>`<tr><td>${st.rank??'—'}</td><td class="name">${esc(st.name)}</td>${multi?`<td class="muted">${esc(st.cls)}</td>`:''}${ss.map(s=>{const v=st.scores[s.label]; if(v==null) return '<td class="absent">غ</td>'; const p=v/s.max*100; return `<td class="${p<S.passPct?'t1':''}">${f1(v)}</td>`}).join('')}
  <td class="${st.avg!=null?tcls(gradeIdx(st.avg)):''}"><b>${f1(st.avg)}</b></td><td>${st.avg!=null?`<span class="pill ${gcls(gradeIdx(st.avg))}">${S.scale[gradeIdx(st.avg)].label}</span>`:'—'}</td><td class="${st.fails?'t1':'muted'}">${st.fails||'—'}</td>${hasEx?['att','beh1','beh2'].map(k=>`<td>${st.ex&&st.ex[k]!=null?f1(st.ex[k]):'—'}</td>`).join(''):''}</tr>`).join('')}
  </tbody></table></div></section>`;
}

function vClasses(){
  const ss=subs();
  if(VC().length<2) return '<div class="panel empty">ارفع ملفين أو أكثر (أو ملفًا بعدة أوراق) لمقارنة الفصول.</div>';
  const keep=S.cls; S.cls='all';
  const rows=VC().map(c=>{S.cls=c.name; const l=students(); const w=l.filter(x=>x.avg!=null);
    return {c,l,avg:w.reduce((a,b)=>a+b.avg,0)/(w.length||1),pass:w.filter(x=>!x.fails).length/(w.length||1)*100,per:ss.map(s=>stats(l,s))}});

function renderMeta(){
  if(S.cls!=='all'&&!VC().some(c=>c.name===S.cls)) S.cls='all';
  const cls=S.cls==='all'?VC():VC().filter(c=>c.name===S.cls);
  const uniq=k=>[...new Set(cls.map(c=>(c.meta||{})[k]).filter(Boolean))];
  const one=k=>{const u=uniq(k);return u.length?u.join('، '):''};
  const n=cls.reduce((a,c)=>a+c.students.length,0);
  const title=S.cls==='all'?(VC().length>1?'جميع الفصول ('+VC().length+')':(VC()[0]?.name||'')):S.cls;
  const items=[['المدرسة',one('school')],['مدير المدرسة',one('principal')],['الصف',one('grade')],['الفصل',one('section')],

  const chip=(v,lab,cnt)=>`<button class="chip" type="button" data-cls="${esc(v)}" aria-pressed="${S.cls===v}">${esc(lab)}<small>${cnt}</small></button>`;

}

const XE=s=>String(s??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const GREEN='0D6650';
function wr(t,o){o=o||{};const sz=o.sz||24;return `<w:r><w:rPr><w:rFonts w:ascii="Sakkal Majalla" w:hAnsi="Sakkal Majalla" w:cs="Sakkal Majalla"/>${o.b?'<w:b/><w:bCs/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:rtl/></w:rPr><w:t xml:space="preserve">${XE(t)}</w:t></w:r>`}
function wp(runs,o){o=o||{};return `<w:p><w:pPr>${o.keep?'<w:keepNext/>':''}${o.border?`<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="4" w:color="${GREEN}"/></w:pBdr>`:''}<w:spacing w:before="${o.before||0}" w:after="${o.after??60}"/><w:bidi/>${o.center?'<w:jc w:val="center"/>':''}</w:pPr>${runs}</w:p>`}
const wt=(t,o)=>wp(wr(t,o),o);
function wtbl(widths,rows,o){o=o||{};
  const bd=o.noBorder?'<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>'
    :'<w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:space="0" w:color="9AA8A1"/>`).join('')+'</w:tblBorders>';
  return `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:jc w:val="center"/>${bd}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>
  ${rows.map((r,ri)=>{const head=ri===0&&o.head, foot=o.foot&&ri===rows.length-1;
    return `<w:tr>${head?'<w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>':'<w:trPr><w:cantSplit/></w:trPr>'}${r.map((c,ci)=>{const cell=typeof c==='object'&&c!==null&&!Array.isArray(c)?c:{t:c};
      const fill=head?GREEN:foot?'E6EEEA':cell.fill;
      const inner=cell.xml||(Array.isArray(cell.t)?cell.t:[cell.t]).map(line=>wp(wr(line,{sz:o.sz||22,b:head||foot||cell.b,color:head?'FFFFFF':cell.color}),{center:o.noBorder?true:(cell.center??(ci>0||head)),after:0})).join('');
      return `<w:tc><w:tcPr><w:tcW w:w="${widths[ci]}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:''}<w:vAlign w:val="center"/></w:tcPr>${inner}</w:tc>`}).join('')}</w:tr>`}).join('')}</w:tbl>`+wp('',{after:60});
}
let IMG=[];
function wimg(png,cx,cy){const id=IMG.length+1;IMG.push(png);const rid='rIdImg'+id;
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Picture ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="image${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`}
function dataUrlBytes(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i);return a}
const PRINT_G=['#1d7a4c','#5b9a2e','#c29a12','#d4741f','#c03a33'];
function chartPng(cfg,w,h){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.style.cssText='position:fixed;left:-99999px;top:0';document.body.appendChild(cv);
  const bg={id:'bg',beforeDraw:c=>{const x=c.ctx;x.save();x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.restore()}};
  cfg.options=Object.assign({responsive:false,animation:false,devicePixelRatio:1},cfg.options);cfg.plugins=[bg];
  const old=Chart.defaults.color;Chart.defaults.color='#333';
  const ch=new Chart(cv,cfg);const url=cv.toDataURL('image/png');ch.destroy();cv.remove();Chart.defaults.color=old;return url;
}
function groupDoc(g,first){
  const list=studentsOf(g), ss=subs(), m=repMeta();
  const vc=VC().find(c=>c.name===g), gm=vc?vc.meta||{}:{};
  const w=list.filter(x=>x.avg!=null), avg=w.reduce((a,b)=>a+b.avg,0)/(w.length||1);
  const passAll=w.filter(x=>!x.fails).length/(w.length||1)*100, weak=list.filter(x=>x.fails>0);
  const st=ss.map(s=>({s,...stats(list,s)})).filter(x=>x.n), by=[...st].sort((a,b)=>b.avg-a.avg);
  const multi=list.some(x=>x._cls)||(g==='all'&&VC().length>1);
  const name=gname(g);
  let x=first?'':'<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
  x+=wt('تقرير تحليل نتائج '+(m.period||'الفترة'),{b:true,sz:36,color:GREEN,center:true,after:40});
  x+=wt(name+(m.year?' · العام الدراسي '+m.year:''),{b:true,sz:28,center:true,after:160});
  x+=wtbl([1680,1680,1680,1680,1690,1690],[['عدد الطلاب','المتوسط العام','الناجحون في كل المواد','عدد المتعثرين','أعلى مادة','أدنى مادة'],
    [String(list.length),f1(avg)+'٪ ('+S.scale[gradeIdx(avg)].label+')',f1(passAll)+'٪',String(weak.length),by[0]?by[0].s.label:'—',by.length?by[by.length-1].s.label:'—'].map(t=>({t,center:true}))],{head:true});
  const H=t=>wt(t,{b:true,sz:30,color:GREEN,before:200,after:80,keep:true});
  // levels
  x+=H('أولًا: توزيع الطلاب على المستويات');
  const hasAbs=st.some(r=>r.absent);
  const lvW=hasAbs?[3200,1150,1150,1150,1150,1150,1150]:[3350,1350,1350,1350,1350,1350];
  const lv=st.map(r=>[r.s.label,...r.dist.map(String),...(hasAbs?[String(r.absent)]:[])]);
  const tot=[0,1,2,3,4].map(i=>st.reduce((a,r)=>a+r.dist[i],0));
  x+=wtbl(lvW,[['المادة',...S.scale.map(s=>s.label),...(hasAbs?['غائب']:[])],...lv,['المجموع',...tot.map(String),...(hasAbs?[String(st.reduce((a,r)=>a+r.absent,0))]:[])]],{head:true,foot:true});
  const stack=chartPng({type:'bar',data:{labels:st.map(r=>r.s.label),datasets:S.scale.map((s,i)=>({label:s.label,data:st.map(r=>+(r.dist[i]/r.n*100).toFixed(1)),backgroundColor:PRINT_G[i]}))},
    options:{indexAxis:'y',plugins:{legend:{position:'bottom',rtl:true,labels:{font:{size:20}}}},scales:{x:{stacked:true,min:0,max:100,reverse:true,ticks:{font:{size:18},callback:v=>v+'%'}},y:{stacked:true,position:'right',ticks:{font:{size:20}}}}}},1600,Math.max(560,st.length*60+160));
  const sh=Math.max(560,st.length*60+160);
  x+=wp(wimg(dataUrlBytes(stack),6300000,Math.round(6300000*sh/1600)),{center:true,after:120});
  // averages
  x+=H('ثانيًا: متوسطات المواد');
  x+=wtbl([2900,1000,1000,1050,1000,1000,1100,1050],[['المادة','العظمى','المتوسط','النسبة','أعلى','أدنى','نسبة النجاح','التقدير'],
    ...st.map(r=>[r.s.label,String(r.s.max),f1(r.avg/100*r.s.max),f1(r.avg)+'٪',f1(r.max/100*r.s.max),f1(r.min/100*r.s.max),f1(r.pass)+'٪',S.scale[gradeIdx(r.avg)].label])],{head:true});
  const av=chartPng({type:'bar',data:{labels:st.map(r=>r.s.label),datasets:[{data:st.map(r=>+r.avg.toFixed(1)),backgroundColor:st.map(r=>PRINT_G[gradeIdx(r.avg)])}]},
    options:{plugins:{legend:{display:false}},scales:{x:{reverse:true,ticks:{font:{size:18},maxRotation:50,minRotation:30}},y:{position:'right',min:0,max:100,ticks:{font:{size:18},callback:v=>v+'%'}}}}},1600,760);
  x+=wp(wimg(dataUrlBytes(av),6300000,Math.round(6300000*760/1600)),{center:true,after:120});
  // top students
  x+=H('ثالثًا: الطلاب المتفوقون');
  const top=[...w].sort((a,b)=>b.avg-a.avg).slice(0,10);
  x+=wtbl(multi?[700,4900,2300,1100,1100]:[800,6300,1500,1500],[['م','اسم الطالب',...(multi?['الفصل']:[]),'المعدل','التقدير'],
    ...top.map((s,i)=>[String(i+1),{t:s.name,center:false},...(multi?[s.cls]:[]),f1(s.avg)+'٪',S.scale[gradeIdx(s.avg)].label])],{head:true});
  // struggling
  x+=H('رابعًا: الطلاب المتعثرون (دون حد النجاح '+S.passPct+'٪)');
  if(weak.length){
    x+=wtbl(multi?[650,3300,1900,4250]:[700,3700,5700],[['م','اسم الطالب',...(multi?['الفصل']:[]),'المواد ودرجاتها'],
      ...weak.sort((a,b)=>b.fails-a.fails).map((s,i)=>[String(i+1),{t:s.name,center:false},...(multi?[s.cls]:[]),{t:ss.filter(z=>{const p=pct(s,z);return p!=null&&p<S.passPct}).map(z=>z.label+' ('+f1(s.scores[z.label])+' من '+z.max+')').join('، '),center:false}])],{head:true});
  } else x+=wt('لا يوجد طلاب دون حد النجاح في أي مادة.',{after:120});
  // notes
  x+=H('خامسًا: ملاحظات وتوصيات');
  const notes=[];
  if(by.length) notes.push('أعلى متوسط في مادة '+by[0].s.label+' ('+f1(by[0].avg)+'٪)، وأدناه في مادة '+by[by.length-1].s.label+' ('+f1(by[by.length-1].avg)+'٪).');

async function saveBlob(f){

  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);
}

      d.sel.map((r,i)=>`<tr class="tall"><td>${i+1}</td><td class="l">${esc(r.st.name)}</td>${d.multi?`<td>${esc(r.st.cls)}</td>`:''}<td>${scoreTxt(r,s)}</td><td></td><td></td></tr>`));
    else add('<p class="rp-note">لا يوجد طلاب محددون.</p>');

function ntDocBody(subjects){
  let x='',first=true;

  ntGroups().forEach(g=>subjects.forEach(s=>{
    const d=ntData(g,s), m=repMeta(); if(!d.x.n) return;
    if(!first) x+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>'; first=false;
    x+=wt('إشعار معلم بنتائج مادة '+s.label,{b:true,sz:30,color:GREEN,center:true,after:0});
    x+=wt(d.name+(m.period?' · '+m.period:''),{b:true,sz:22,center:true,after:80});
    x+=wp(wr('المكرم المعلم/ ',{sz:22})+wr(d.teacher||'.......................................',{b:true,sz:22})+wr('   وفقه الله',{sz:22}),{after:20});
    x+=wt('السلام عليكم ورحمة الله وبركاته، وبعد:',{sz:22,after:20});
    x+=wt(ntIntro(d,m),{sz:d.sel.length>12?20:22,after:40});
    x+=H('أولًا: توزيع الطلاب على المستويات');
    const hd=[...S.scale.map(l=>l.label),...(d.absent.length?['غائب']:[]),'المجموع','المتوسط','نسبة النجاح'];
    const cw=Math.floor(10080/hd.length);
    x+=wtbl(hd.map(()=>cw),[hd,[...d.byLevel.map(l=>String(l.length)),...(d.absent.length?[String(d.absent.length)]:[]),String(d.list.length),f1(d.x.avg)+'٪',f1(d.x.pass)+'٪'].map(t=>({t,center:true}))],{head:true,sz:20});
    x+=H('ثانيًا: طلاب كل مستوى');
    x+=wtbl([1500,900,7680],[['المستوى','العدد','أسماء الطلاب (الدرجة من '+s.max+')'],
      ...d.byLevel.map((l,i)=>l.length?[{t:S.scale[i].label,b:true,center:true},String(l.length),{t:l.map(r=>r.st.name+' ('+f1(r.v)+')').join('، '),center:false}]:null).filter(Boolean),
      ...(d.absent.length?[[{t:'غائب',b:true,center:true},String(d.absent.length),{t:d.absent.map(r=>r.st.name).join('، '),center:false}]]:[])],{head:true,sz:d.sel.length>12?16:19});
    if(EX.ntDue) x+=wp(wr('موعد الإفادة: ',{sz:20})+wr(EX.ntDue,{b:true,sz:20}),{after:20});
    const sig=(t,n)=>({xml:[wp(wr(t+': ',{b:true,sz:20})+wr(n||'....................',{sz:20}),{center:true,after:20}),wp(wr('التوقيع: ................',{sz:18}),{center:true,after:0})].join('')});
    x+=wtbl([5040,5040],[[sig('معد التقرير',m.prep),sig('مدير المدرسة',m.principal)]],{noBorder:true});
    x+=H('ثالثًا: الطلاب المحددون والإفادة المطلوبة');
    if(d.sel.length){
      const blank=d.sel.length>8?['']:['',''];
      const w=d.multi?[500,2500,1100,1000,2480,2500]:[500,2700,1100,2880,2900];
      x+=wtbl(w,[['م','اسم الطالب',...(d.multi?['الفصل']:[]),'الدرجة','أسباب انخفاض المستوى','الإجراء العلاجي المقترح'],
        ...d.sel.map((r,i)=>[String(i+1),{t:r.st.name,center:false},...(d.multi?[r.st.cls]:[]),scoreTxt(r,s),{t:blank,center:false},{t:blank,center:false}])],{head:true,sz:d.sel.length>12?16:19});
    } else x+=wt('لا يوجد طلاب محددون.');
    x+=wp(wr('المعلم: ',{b:true,sz:20})+wr(d.teacher||'..............................',{sz:20})+wr('          التوقيع: ....................          التاريخ: ..../..../....هـ',{sz:20}),{before:60,after:0});
  }));
  return x;
}
async function doNoticeExport(btn){

}

(function sample(){
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const first=['عبدالله','محمد','فهد','سعود','خالد','عمر','يوسف','ريان','سلطان','تركي','نايف','بندر','زياد','مشاري','عبدالرحمن','فيصل','حمد','ماجد','راكان','وليد','بدر','سامي'];
  const fam=['العتيبي','القحطاني','الشهري','الغامدي','الحربي','الزهراني','المطيري','الدوسري','السبيعي','العنزي','الشمري','البقمي'];
  const subj=[['القرآن الكريم والدراسات الإسلامية',100,6],['اللغة العربية',60,0],['الرياضيات',60,-10],['العلوم',60,-5],['اللغة الانجليزية',60,-14],['الدراسات الاجتماعية',100,2],['المهارات الرقمية',100,5],['التفكير الناقد',100,-2],['التربية الفنية',100,10],['التربية البدنية والدفاع عن النفس',100,12]];
  ['1','2'].forEach((sec,ci)=>{
    const st=[];
    for(let i=0;i<20;i++){
      const ability=58+rnd()*38+(ci?-4:0); const sc={};
      subj.forEach(([s,mx,d])=>{let p=ability+d+(rnd()-.5)*22; p=Math.max(15,Math.min(100,p)); sc[s]=rnd()<0.015?null:Math.round(p/100*mx*2)/2});
      st.push({name:first[Math.floor(rnd()*first.length)]+' '+first[Math.floor(rnd()*first.length)]+' '+fam[Math.floor(rnd()*fam.length)],scores:sc,ex:{att:90+Math.round(rnd()*10),beh1:Math.round(rnd()*6),beh2:60+Math.round(rnd()*20)}});
    }
    S.classes.push({key:'s'+sec,name:'الثالث المتوسط / '+sec,meta:{school:'مدرسة تجريبية (مثال)',principal:'اسم المدير (مثال)',grade:'الثالث المتوسط',section:sec,year:'1447-1448',term:'الفصل الأول',period:'إشعار فترة أولى'},students:st});
  });
  S.subjects=subj.map(([l,mx])=>({label:l,max:mx,on:true}));
})();
